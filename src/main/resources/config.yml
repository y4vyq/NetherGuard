# 内置：zh_CN（简体中文）、zh_TW（繁體中文）、en_US（English）
language: zh_CN

storage:
  type: sqlite   # sqlite / mysql
  sqlite:
    file: regions.db
  mysql:
    host: localhost
    port: 3306
    database: portal_region
    username: root
    password: ""
    table-prefix: "pr_"

limits:
  max-regions-per-player: 5
  allow-overlap: true
  use-2d: false

event:
  cancel-portal-create: true
  cancel-player-portal: true
  notify-player: true
  # 可选：只拦截特定创建原因，留空表示全部拦截
  # 可选值：FIRE / NETHER_PORTAL / END_PORTAL / CUSTOM
  intercept-reasons: []

command:
  create-timeout-seconds: 5
  list-page-size: 10

debug: false